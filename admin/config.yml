backend:
  name: git-gateway
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/_data/site.json"
        label: "Site Info"
        name: "site"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - label: "Homepage"
            name: "home"
            widget: "object"
            fields:
              - { label: "Headline", name: "heroHeadline", widget: "string" }
              - { label: "Subtext", name: "heroDek", widget: "text" }
              - label: "Why Players Stay (3 cards)"
                name: "valueProps"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
          - label: "Next Game"
            name: "nextGame"
            widget: "object"
            fields:
              - { label: "Time", name: "time", widget: "string" }
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Group", name: "group", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
          - label: "Groups"
            name: "groups"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Tag (day/time)", name: "tag", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Weekly Schedule"
            name: "schedule"
            widget: "list"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Time", name: "time", widget: "string" }
              - { label: "Groups Playing", name: "focus", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string" }

  - name: "blog"
    label: "News / Blog"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt (shows in list view)", name: "excerpt", widget: "text" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - file: "src/about.md"
        label: "About"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "src/rules.md"
        label: "Rules"
        name: "rules"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Gallery Photos"
    folder: "src/gallery"
    media_folder: "/images/uploads"
    public_folder: "/images/uploads"
    create: true
    fields:
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: false }
