backend:
  name: github
  repo: ebgomez/cvsa-site
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/_data/site.json"
        label: "Site Info"
        name: "site"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - label: "Homepage"
            name: "home"
            widget: "object"
            fields:
              - { label: "Headline", name: "heroHeadline", widget: "string" }
              - { label: "Subtext", name: "heroDek", widget: "text" }
              - label: "Why Players Stay (3 cards)"
                name: "valueProps"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
          - label: "Groups"
            name: "groups"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Tag (day/time)", name: "tag", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
                media_folder: "/src/images/uploads"
                public_folder: "/images/uploads"
          - label: "Weekly Schedule"
            name: "schedule"
            widget: "list"
            hint: "This drives both the Schedule page AND the automatic 'Next Game' box on the homepage — it always shows whichever session below is coming up next, so you only need to update this if the recurring weekly pattern itself changes."
            fields:
              - label: "Day"
                name: "day"
                widget: "select"
                options: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
              - { label: "Time", name: "time", widget: "string", hint: "Format exactly like: 6:30 PM - 8:00 PM" }
              - { label: "Groups Playing", name: "focus", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "GroupMe URL", name: "groupme", widget: "string", required: false }
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Map / Directions Link", name: "mapLink", widget: "string", required: false, hint: "Paste a Google Maps link for the gym — go to maps.google.com, search the address, click Share, copy the link. Shows as a 'Get Directions' link on the Contact page." }
              - label: "Liability Waiver (PDF)"
                name: "waiverPdf"
                widget: "file"
                required: false
                media_folder: "/src/files"
                public_folder: "/files"
                hint: "Upload the signed/blank liability waiver as a PDF — a download link will show on the Contact page."

  - name: "blog"
    label: "News / Blog"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", hint: "Defaults to today when you create a new post — change it if you're backdating or scheduling something." }
      - label: "Cover Image"
        name: "image"
        widget: "image"
        required: false
        media_folder: "/src/images/uploads"
        public_folder: "/images/uploads"
        hint: "Optional — shows above the post on the homepage and News page."
      - { label: "Excerpt (shows in list view)", name: "excerpt", widget: "text" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - file: "src/about.md"
        label: "About"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "src/rules.md"
        label: "Rules"
        name: "rules"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "photos"
    label: "Photos"
    files:
      - file: "src/_data/gallery.json"
        label: "Gallery Photos"
        name: "gallery"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "image"
            multiple: true
            required: false
            media_folder: "/src/images/uploads"
            public_folder: "/images/uploads"
            hint: "This is the only place photos need to go. Select as many as you want at once — they show up on the Gallery page and the homepage automatically. No captions here; for a video, use the separate Videos section instead."

  - name: "videos"
    label: "Videos"
    folder: "src/videos"
    create: true
    fields:
      - { label: "YouTube / Vimeo link", name: "videoUrl", widget: "string", hint: "Paste a normal video URL (e.g. https://youtube.com/watch?v=... or https://vimeo.com/...). Upload the video there first (Unlisted is fine if you don't want it publicly searchable), then link it here." }
      - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: false }
