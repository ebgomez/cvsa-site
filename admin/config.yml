backend:
  name: github
  repo: ebgomez/cvsa-site
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/_data/site.json"
        label: "Site Info"
        name: "site"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - label: "Homepage"
            name: "home"
            widget: "object"
            fields:
              - { label: "Headline", name: "heroHeadline", widget: "string" }
              - { label: "Subtext", name: "heroDek", widget: "text" }
              - label: "Why Players Stay (3 cards)"
                name: "valueProps"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
          - label: "Groups"
            name: "groups"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Tag (day/time)", name: "tag", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Weekly Schedule"
            name: "schedule"
            widget: "list"
            hint: "This drives both the Schedule page AND the automatic 'Next Game' box on the homepage — it always shows whichever session below is coming up next, so you only need to update this if the recurring weekly pattern itself changes."
            fields:
              - label: "Day"
                name: "day"
                widget: "select"
                options: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
              - { label: "Time", name: "time", widget: "string", hint: "Format exactly like: 6:30 PM - 8:00 PM" }
              - { label: "Groups Playing", name: "focus", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string" }

  - name: "blog"
    label: "News / Blog"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt (shows in list view)", name: "excerpt", widget: "text" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - file: "src/about.md"
        label: "About"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "src/rules.md"
        label: "Rules"
        name: "rules"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Gallery Photos & Videos"
    folder: "src/gallery"
    media_folder: "/src/images/uploads"
    public_folder: "/images/uploads"
    create: true
    fields:
      - { label: "Photo", name: "image", widget: "image", required: false, hint: "Fill in EITHER this photo field OR one of the two video options below — not more than one." }
      - { label: "Video file (short clips only)", name: "video", widget: "file", required: false, hint: "Keep it small — under ~20MB. GitHub hard-rejects anything over 100MB, and big videos slow the site down. For anything longer, use the link field instead." }
      - { label: "Or a YouTube / Vimeo link", name: "videoUrl", widget: "string", required: false, hint: "Paste a normal video URL (e.g. https://youtube.com/watch?v=... or https://vimeo.com/...). Recommended for anything more than a few seconds — upload it there first (Unlisted is fine) and link it here." }
      - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: false }
